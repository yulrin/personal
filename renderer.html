<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knit Hamster</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overlay">
  <main id="pet" class="pet knitting" aria-label="Knit Hamster">
    <div class="drag-zone" title="드래그해서 옮기기"></div>

    <div class="hamster-wrap">
      <img class="hamster" src="assets/hamster-transparent.png" alt="">
      <span class="blink-lid blink-lid-left" aria-hidden="true"></span>
      <span class="blink-lid blink-lid-right" aria-hidden="true"></span>
    </div>

    <svg class="knit-layer" viewBox="0 0 260 235" aria-hidden="true">
      <defs>
        <filter id="pixelShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#3a251b" flood-opacity="0.28"/>
        </filter>
      </defs>

      <g class="fabric-shadow">
        <rect x="99" y="120" width="62" height="82" rx="3"></rect>
      </g>
      <g id="fabricRows" class="fabric-rows"></g>

      <path id="workingYarn" class="working-yarn" d="M40 183 C72 175 85 143 105 132 C119 124 137 124 154 132 C176 145 194 169 223 168"></path>
      <path id="loopA" class="live-loop loop-a" d="M112 124 C118 107 136 107 143 124 C139 139 116 139 112 124"></path>
      <path id="loopB" class="live-loop loop-b" d="M122 125 C128 111 145 111 151 125 C147 137 126 137 122 125"></path>

      <g id="needleLeft" class="needle needle-left" filter="url(#pixelShadow)">
        <line x1="63" y1="164" x2="143" y2="119"></line>
        <circle cx="63" cy="164" r="6"></circle>
        <path d="M140 117 L151 113 L145 124 Z"></path>
      </g>

      <g id="needleRight" class="needle needle-right" filter="url(#pixelShadow)">
        <line x1="199" y1="163" x2="122" y2="119"></line>
        <circle cx="199" cy="163" r="6"></circle>
        <path d="M125 117 L114 113 L120 124 Z"></path>
      </g>

      <g id="yarnHook" class="yarn-hook">
        <circle cx="132" cy="121" r="5"></circle>
        <path d="M128 121 C133 114 141 116 143 122"></path>
      </g>
    </svg>

    <div id="statusPill" class="status-pill">knitting</div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
